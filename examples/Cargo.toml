[package]
name = "examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated code for the example VibeService, committed for parity checks, plus the mcp-vibe demo server."
publish = false

[lib]
name = "examples"
path = "src/lib.rs"

[[bin]]
name = "mcp-vibe"
path = "src/bin/mcp-vibe.rs"

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = [
    "codegen",
    "channel",
    "server",
    # `mcp-vibe` (src/bin/mcp-vibe.rs) runs an in-process `VibeService`
    # backend with `Server::builder().add_service(...)`, which needs the
    # router feature (tests/handler.rs needed the same thing as a
    # dev-dependency before this binary existed as a normal one).
    "router",
] }
tonic-prost = "0.14"
pbjson = "0.8"
pbjson-types = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
rmcp = { version = "3.5", default-features = false, features = [
    "server",
    # `mcp-vibe` serves MCP over stdio (`rmcp::transport::io::stdio`); this
    # was a test-only dev-dependency before this binary existed.
    "transport-io",
] }
futures = "0.3"
# Validates tool call arguments against the generated input schema before
# decoding them (see protoc-gen-rust-mcp/src/server.rs's module doc
# comment): a runtime dependency of the generated handlers, not just this
# crate's tests, so it's a normal (not dev-)dependency. No HTTP/file
# `$ref` resolution is needed (every generated schema is self-contained),
# hence `default-features = false`.
jsonschema = { version = "0.58", default-features = false }
# `mcp-vibe`'s async runtime: "rt-multi-thread" and "macros" to run
# `#[tokio::main]`, "net" for the in-process backend's `TcpListener`,
# and "signal" to shut down cleanly on SIGINT/SIGTERM.
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
] }

[dev-dependencies]
# tests/handler.rs drives the generated server through a real rmcp
# client ("client") over an in-memory duplex transport, instead of
# calling the handler directly, so it exercises the same wire path a
# real MCP client would. tests/mcp_vibe_binary.rs goes one step further
# and spawns the real `mcp-vibe` binary as a subprocess
# ("transport-child-process"), driving it over its actual stdio
# transport.
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "transport-child-process",
] }
