[package]
name = "examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated code for the example VibeService, committed for parity checks, plus the mcp-vibe demo server."
publish = false

[lib]
name = "examples"
path = "src/lib.rs"

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = [
    "codegen",
    "channel",
    "server",
] }
tonic-prost = "0.14"
pbjson = "0.8"
pbjson-types = "0.8"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
