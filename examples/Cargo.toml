[package]
name = "examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated code for the example VibeService, committed for parity checks, plus the mcp-vibe demo server."
publish = false

[lib]
name = "examples"
path = "src/lib.rs"

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = [
    "codegen",
    "channel",
    "server",
] }
tonic-prost = "0.14"
pbjson = "0.8"
pbjson-types = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
rmcp = { version = "3.5", default-features = false, features = ["server"] }
futures = "0.3"
# Validates tool call arguments against the generated input schema before
# decoding them (see protoc-gen-rust-mcp/src/server.rs's module doc
# comment): a runtime dependency of the generated handlers, not just this
# crate's tests, so it's a normal (not dev-)dependency. No HTTP/file
# `$ref` resolution is needed (every generated schema is self-contained),
# hence `default-features = false`.
jsonschema = { version = "0.58", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# "router" adds Server::builder()/add_service, to run a real in-process
# tonic server in tests/handler.rs ("server" and "channel" are already
# pulled in by [dependencies].tonic above).
tonic = { version = "0.14", default-features = false, features = ["router"] }
