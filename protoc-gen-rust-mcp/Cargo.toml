[package]
name = "protoc-gen-rust-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A protoc plugin that generates an MCP server from a gRPC service definition."
publish = false

[lib]
name = "protoc_gen_rust_mcp"
path = "src/lib.rs"

[[bin]]
name = "protoc-gen-rust-mcp"
path = "src/main.rs"

[dependencies]
prost = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"
serde_json = "1"
heck = "0.5"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
pretty_assertions = "1.4"
protox = "0.10.0"
rand = "0.10"
pbjson = "0.8"
pbjson-types = "0.8"
serde = { version = "1", features = ["derive"] }
syn = { version = "3", features = ["parsing"] }

[dev-dependencies.rmcp]
version = "3.5"
default-features = false
features = ["server", "client", "transport-io"]

[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread"]

[dev-dependencies.futures]
version = "0.3"

[dev-dependencies.tonic]
version = "0.14"
default-features = false
# "server" + "router" run a real in-process tonic server in
# tests/server_integration.rs, so the generated handler body (#7) is
# exercised against a real backend, not just a never-connecting client.
features = ["codegen", "channel", "server", "router"]

[dev-dependencies.tonic-prost]
version = "0.14"

[build-dependencies]
# Used only by build.rs, to compile tests/testdata/schemapb/schema.proto
# (and tests/testdata/mcpgen/fixture.proto, for server.rs's integration
# test) into pbjson-generated and tonic-generated Rust types, and (for the
# mcpgen fixture) to run this crate's own code generator: build.rs
# `#[path]`-includes src/{comments,rust_literal,schema,server,
# source_info}.rs directly (a build script can't depend on the library
# it's building), so every crate those modules import needs to be
# available here too, not just under [dependencies].
protox = "0.10"
prost-build = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
pbjson-build = "0.8"
tonic-prost-build = { version = "0.14", default-features = false }
heck = "0.5"
serde_json = "1"
