[package]
name = "protoc-gen-rust-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A protoc plugin that generates an MCP server from a gRPC service definition."
publish = false

[lib]
name = "protoc_gen_rust_mcp"
path = "src/lib.rs"

[[bin]]
name = "protoc-gen-rust-mcp"
path = "src/main.rs"

[dependencies]
prost = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"
serde_json = "1"
heck = "0.5"
# Formats generator.rs's output with the same approach prost-build and
# tonic-build use for their own generated code (see
# prost_build::Config::format's prettyplease::unparse call): a normal
# dependency, not a build-dependency, since it runs inside this crate's
# own library code (generator::generate), not a build script (#22: this
# crate has no build.rs at all; see test-fixtures/ for the proto
# compilation this crate's *tests* need).
syn = { version = "3", default-features = false, features = ["parsing"] }
prettyplease = "0.3"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
pretty_assertions = "1.4"
protox = "0.10.0"
rand = "0.10"
pbjson-types = "0.8"
serde = { version = "1", features = ["derive"] }
# Compiles tests/testdata/{schemapb,mcpgen} (via its own build.rs) and
# runs this crate's own generator against the mcpgen fixture with real
# tonic-generated/pbjson-generated types, so schema.rs's and
# server_integration.rs's tests don't need this crate's own build.rs to
# do that work (#22).
test-fixtures = { path = "../test-fixtures" }

[dev-dependencies.rmcp]
version = "3.5"
default-features = false
features = ["server", "client", "transport-io"]

[dev-dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread"]

[dev-dependencies.futures]
version = "0.3"

[dev-dependencies.tonic]
version = "0.14"
default-features = false
# "server" + "router" run a real in-process tonic server in
# tests/server_integration.rs, so the generated handler body (#7) is
# exercised against a real backend, not just a never-connecting client.
features = ["codegen", "channel", "server", "router"]

[dev-dependencies.tonic-prost]
version = "0.14"
